name: WMMT
options:
  bundleIdPrefix: com.wmmt
  deploymentTarget:
    iOS: "14.0"
targets:
  WMMT:
    type: application
    platform: iOS
    sources:
      - path: ios/main.m
      - path: src
        excludes:
          - "main_android.c"
          - "gk_ios.m"
          - "main.m"
          - "vkgl.c"
          - "vkgl.h"
          - "gk_ios.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmmt.port.iphone
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "6"
        INFOPLIST_FILE: ios/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        GCC_C_LANGUAGE_STANDARD: c11
        CLANG_ENABLE_OBJC_ARC: NO
        # 与 build.sh 一致：物理的浮点不能被 FMA 合并（bit-for-bit 对齐街机），优化取 -O2
        OTHER_CFLAGS: "-DRC_FPT=double -w -ffp-contract=off"
        GCC_OPTIMIZATION_LEVEL: 2
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: UIKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - sdk: OpenGLES.framework
      - sdk: Foundation.framework
      - sdk: libz.tbd
