name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la WMMT.xcodeproj 2>/dev/null || echo no xcodeproj

      - name: Show Xcode target list
        run: |
          xcodebuild -list -project WMMT.xcodeproj || true

      - name: Build unsigned .ipa
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcodebuild \
            -project WMMT.xcodeproj \
            -scheme WMMT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WMMT.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          mkdir -p build/Payload
          cp -a "build/WMMT.xcarchive/Products/Applications/WMMT.app" build/Payload/
          cd build && zip -r WMMT.ipa Payload -x '*.DS_Store'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WMMT-ipa
          path: build/WMMT.ipa
          retention-days: 7
